<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            height: 100vh;
            background: #111827;
            padding: 20px;
            position: fixed;
            width: 250px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 10px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .content {
            margin-left: 260px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: none;
            border-radius: 12px;
        }

        .table-dark {
            background: #1e293b;
        }

        .btn-primary, .btn-success, .btn-danger {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="sidebar">
</html>
